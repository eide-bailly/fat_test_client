version: 2

models:
  - name: stg_extract_config
    description: Active extract configuration with source system context. Joins extract_config and source_system seeds. Only active source systems and active objects are included.
    columns:
      - name: extract_config_id
        data_tests: [not_null, unique]
      - name: orchestration_id
        data_tests: [not_null]
      - name: source_system_id
        data_tests: [not_null]
      - name: object_name
        data_tests: [not_null]
      - name: load_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [incremental, full]
