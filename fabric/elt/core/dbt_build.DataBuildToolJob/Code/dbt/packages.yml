# packages.yml — dbt package dependencies
#
# Update version pins per engagement. Validate against the dbt Core version in use:
#   - Fabric dbt job runtime v1.0 ships dbt Core v1.9 (as of June 2026).
#   - Run `dbt deps` after changing versions to confirm resolution.
#
# dbt-utils changelog: https://github.com/dbt-labs/dbt-utils/blob/main/CHANGELOG.md
# dbt-date changelog:  https://github.com/calogica/dbt-date/blob/main/CHANGELOG.md

packages:
  - package: dbt-labs/dbt_utils
    version: 1.3.0  # Latest compatible with dbt Core 1.9; check for updates per engagement

  - package: godatadriven/dbt_date
    version: 0.16.1  # Latest compatible with dbt Core 1.9; check for updates per engagement
